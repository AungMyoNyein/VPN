name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, pcntl, redis
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # CI uses sqlite; override pgsql defaults from .env.example
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^REDIS_CLIENT=.*/REDIS_CLIENT=predis/' .env || true
          touch database/database.sqlite
      - name: Lint (Pint)
        run: vendor/bin/pint --test
      - name: Unit & feature tests
        run: php artisan test

  control-plane:
    name: Control plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/control-plane ./cmd/control-plane

  node-agent:
    name: Node agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/node-agent ./cmd/node-agent

  crm:
    name: CRM (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  docs:
    name: Docs presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required Phase 0 docs exist
        run: |
          set -euo pipefail
          for f in \
            docs/ARCHITECTURE.md \
            docs/HLD.md \
            docs/UI_UX.md \
            docs/SECURITY.md \
            docs/API.md \
            docs/DATABASE.md \
            docs/THREAT_MODEL.md \
            docs/OPERATIONS.md \
            docs/wireframes/mobile.md \
            docs/wireframes/crm.md \
            docs/ADR/0001-monorepo-layout.md \
            docs/ADR/0002-device-centric-vpn-keys.md \
            docs/ADR/0003-laravel-control-plane-boundary.md \
            docs/ADR/0004-wireguard-phase1-protocol.md \
            docs/ADR/0005-api-envelope-and-error-codes.md \
            docs/ADR/0006-node-agent-narrow-api.md \
            docs/ADR/0007-documentation-sources-of-truth.md \
            docs/ADR/0008-activation-key-auth.md \
            README.md \
            crm/package.json \
            infrastructure/docker/docker-compose.yml
          do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
