global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-agent
    static_configs:
      - targets: ["node-agent:8082"]
    metrics_path: /metrics

  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:8081"]
    metrics_path: /internal/v1/health
    # Phase 0: health is JSON; Prometheus scrape of CP metrics arrives Phase 2/7
