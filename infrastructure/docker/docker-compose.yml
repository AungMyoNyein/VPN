services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn_dev_password
    # Host 5432 is often taken; publish on 15432 for this machine
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host 6379 is often taken; publish on 16379 for this machine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    working_dir: /var/www/html
    volumes:
      - ../../backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vpn
      DB_USERNAME: vpn
      DB_PASSWORD: vpn_dev_password
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      CONTROL_PLANE_BASE_URL: http://control-plane:8081
      CONTROL_PLANE_SERVICE_TOKEN: dev-only-change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started
    command: >
      sh -c "php artisan migrate --force --no-interaction || true;
             php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    working_dir: /var/www/html
    volumes:
      - ../../backend:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vpn
      DB_USERNAME: vpn
      DB_PASSWORD: vpn_dev_password
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - api
      - redis
    profiles: ["workers"]
    command: php artisan queue:work --sleep=1 --tries=3

  control-plane:
    build:
      context: ../../control-plane
      dockerfile: ../infrastructure/docker/Dockerfile.control-plane
    environment:
      CP_ENV: local
      CP_HTTP_ADDR: ":8081"
      CP_SERVICE_TOKEN: dev-only-change-me
    ports:
      - "8081:8081"

  node-agent:
    build:
      context: ../../node-agent
      dockerfile: ../infrastructure/docker/Dockerfile.node-agent
    environment:
      AGENT_HTTP_ADDR: ":8082"
      AGENT_NODE_CODE: DEV-01
      AGENT_ADAPTER: fake
      AGENT_CP_BASE_URL: http://control-plane:8081
    ports:
      - "8082:8082"
    depends_on:
      - control-plane
    profiles: ["agents"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    profiles: ["monitoring"]
    depends_on:
      - prometheus

volumes:
  postgres_data:
